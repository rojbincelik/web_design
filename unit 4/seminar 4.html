1. **What are the benefits of external CSS compared to inline styling?**
   External CSS keeps styling in a separate `.css` file, 
   which makes the HTML cleaner and easier to maintain. 
   It also allows the same styles to be reused across multiple webpages. 
   If a design change is needed, 
   it can be updated in one place instead of changing many individual HTML elements.

   **External CSS’in inline styling’e göre avantajları nelerdir?
    External CSS, stil kodlarını ayrı bir .css dosyasında tutar. 
    Bu sayede HTML kodu daha temiz ve düzenli olur. 
    Aynı stil dosyası birden fazla web sayfasında kullanılabilir. 
    Ayrıca tasarımda bir değişiklik yapılması gerektiğinde, 
    her HTML elemanını tek tek değiştirmek yerine sadece CSS dosyasını güncellemek yeterlidir.

2. **How does JavaScript enhance user interaction on webpages?**
   JavaScript makes webpages more dynamic and interactive. 
   It can respond to user actions such as clicks, form submissions,
    keyboard input, and mouse movements. 
    For example, JavaScript can validate a form, display or hide content, 
    create animations, and update information on a page without reloading it.
** JavaScript web sayfalarında kullanıcı etkileşimini nasıl geliştirir?
    JavaScript, web sayfalarını daha dinamik ve etkileşimli hale getirir. 
    Kullanıcının tıklama, form gönderme, klavye kullanma veya fare hareketleri gibi işlemlerine tepki verebilir. 
    Örneğin JavaScript ile form doğrulama yapılabilir, içerikler gösterilip gizlenebilir, 
    animasyonlar eklenebilir ve sayfa yenilenmeden içerik güncellenebilir.
3. **What is the difference between `id` and `class` selectors in CSS?**
   An `id` is generally used for one unique element on a webpage, 
   while a `class` can be applied to multiple elements. 
   In CSS, an `id` selector uses `#`, such as `#header`, while a class selector uses `.`, 
   such as `.button`. Classes are better for reusable styles, 
   while IDs are useful for uniquely identifying a specific element.
   **CSS’te id ve class seçicileri arasındaki fark nedir?
    id, genellikle bir web sayfasındaki tek ve benzersiz bir elementi tanımlamak için kullanılır. 
    class ise birden fazla elemente uygulanabilir. 
    CSS’te id seçicisi # işaretiyle, örneğin #header şeklinde yazılır. 
    class seçicisi ise . işaretiyle, örneğin .button şeklinde yazılır. 
    class tekrar kullanılabilir stiller için, 
    id ise belirli ve benzersiz bir elementi tanımlamak için daha uygundur.
