<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Send Travel Explorer a question about a destination.">
  <title>Travel Explorer – Contact</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <a href="index.html" class="logo">Travel Explorer</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">☰</button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <p class="js-fallback">This site needs JavaScript. If you opened the file directly, run it through a local web server (see README.md).</p>
    <section class="page-intro">
      <h1>Contact us</h1>
      <p>Have a question about a destination? Send us a message.</p>
    </section>

    <section class="contact" aria-labelledby="contact-heading">
      <h2 id="contact-heading" class="visually-hidden">Contact form</h2>
      <form id="contact-form" class="contact-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" required minlength="2" autocomplete="name">
          <p class="error" id="name-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
          <p class="error" id="email-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required minlength="10"></textarea>
          <p class="error" id="message-error" aria-live="polite"></p>
        </div>

        <button type="submit" class="btn">Send message</button>
        <p id="form-status" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Travel Explorer</p>
  </footer>
</body>
</html>
